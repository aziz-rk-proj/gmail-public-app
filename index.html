<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Reader App</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f9f9f9; }
        .card { background: white; padding: 30px; border-radius: 8px; max-width: 500px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        button { background-color: #4285F4; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #357ae8; }
        footer { margin-top: 30px; font-size: 14px; }
        footer a { color: #555; text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Welcome to Gmail Reader App</h2>
        <p>Connect your Google Account to view your Gmail profile and messages securely.</p>
        <button onclick="loginWithGoogle()">Sign in with Google</button>
    </div>

    <footer>
        <a href="index.html">Home</a> | 
        <a href="privacy.html">Privacy Policy</a> | 
        <a href="terms.html">Terms of Service</a>
    </footer>

    <script>
        function loginWithGoogle() {
            // Replace with your Client ID from Google Cloud Console
            const CLIENT_ID = '729142901918-b6mn7rcjbnqr8ert68q6cl0s2sfj8eat.apps.googleusercontent.com';
            const REDIRECT_URI = window.location.origin; // Vercel domain auto-detect
            const SCOPE = 'https://www.googleapis.com/auth/gmail.readonly';
            const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?response_type=token&client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&scope=${SCOPE}`;
            window.location.href = authUrl;
        }
    </script>
</body>
</html>
